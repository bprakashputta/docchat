# Postgres 16 with the pgvector extension, for local development.
# Host port 5433 (not 5432) so it doesn't clash with a locally installed Postgres.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docchat}
      POSTGRES_DB: ${POSTGRES_DB:-docchat}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
